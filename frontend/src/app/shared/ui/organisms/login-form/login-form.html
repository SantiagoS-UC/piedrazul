<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h1>Iniciar sesión</h1>

  @if (infoMessage()) {
    <app-alert type="info">{{ infoMessage() }}</app-alert>
  }
  @if (errorMessage()) {
    <app-alert type="error">{{ errorMessage() }}</app-alert>
  }

  <app-form-field label="Correo electrónico" fieldId="login-email" required [error]="errorOf('email')">
    <input
      appFieldControl
      id="login-email"
      type="email"
      formControlName="email"
      autocomplete="email"
      required
      [invalid]="!!errorOf('email')"
      [describedBy]="describedBy('login-email')"
    />
  </app-form-field>

  <app-form-field label="Contraseña" fieldId="login-password" required [error]="errorOf('password')">
    <app-password-input
      inputId="login-password"
      formControlName="password"
      [invalid]="!!errorOf('password')"
      [describedBy]="describedBy('login-password')"
    />
  </app-form-field>

  <button appButton type="submit" block [loading]="loading()" [disabled]="loading()">
    {{ loading() ? 'Ingresando…' : 'Iniciar sesión' }}
  </button>
</form>
