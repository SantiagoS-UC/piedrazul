name: CI

# Integración continua: cada PR y cada push a develop compila el proyecto y corre las pruebas
# automáticas del backend y del frontend. En main lo ejecuta el workflow de despliegue continuo
# antes de desplegar, por eso aquí no se escucha el push a main.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y correr las pruebas
        run: ./mvnw -B verify

      - name: Guardar los reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-backend
          path: backend/target/surefire-reports

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Correr las pruebas
        run: npx ng test --watch=false

      - name: Compilar para producción
        run: npx ng build
