# Los valores por defecto coinciden con docker-compose.yml, así cada integrante arranca sin
# configurar nada. En otros entornos se sobrescriben con variables de entorno.
spring:
  application:
    name: piedrazul
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/piedrazul}
    username: ${DB_USERNAME:piedrazul}
    password: ${DB_PASSWORD:piedrazul}
    hikari:
      # El plan gratuito de Neon admite pocas conexiones simultáneas.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    # Flyway es el único dueño del esquema; Hibernate solo valida que las entidades coincidan.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Solo se aceptan tokens emitidos por este realm de Keycloak.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/piedrazul}
  flyway:
    # Cada módulo versiona sus migraciones en su propia carpeta y rango (identity 1.x,
    # professionals 2.x, configuration 3.x, appointments 4.x). Como se desarrollan en paralelo,
    # una migración de menor versión puede llegar después de otra ya aplicada.
    out-of-order: true

management:
  endpoints:
    web:
      # Solo salud e información; el resto de endpoints de Actuator no se publica.
      exposure:
        include: health,info
  endpoint:
    health:
      # Muestra el estado de cada componente (base de datos, disco) sin detalles internos.
      show-components: always
      probes:
        enabled: true
  info:
    # Publica las propiedades info.* de abajo; desde Spring Boot 3 viene apagado.
    env:
      enabled: true
    java:
      enabled: true

info:
  app:
    name: Piedrazul
    description: Sistema de reserva de citas médicas

logging:
  pattern:
    # El id de la petición (RequestLoggingFilter) en cada línea, para seguirla en los logs de Render.
    correlation: "[%X{requestId:-}] "

server:
  # 8081 y no 8080 porque algunos equipos ya tienen servicios del sistema escuchando en 8080.
  # En Render el puerto lo asigna la plataforma en la variable PORT.
  port: ${PORT:${SERVER_PORT:8081}}

piedrazul:
  # Cuenta de servicio con la que el registro crea a los pacientes en Keycloak.
  keycloak:
    url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:piedrazul}
    client-id: piedrazul-backend
    # Solo para desarrollo; coincide con keycloak/piedrazul-realm.json.
    client-secret: ${KEYCLOAK_CLIENT_SECRET:piedrazul-backend-dev-secret}
  # Orígenes desde los que el navegador puede llamar a la API, separados por coma. En local no hace
  # falta porque el servidor de Angular reenvía /api; en la nube el frontend vive en otro dominio.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
